[package]
name = "luma-config"
version = "0.1.0"
edition = "2024"
description = "App nativo de configuração do Luma (cliente Wayland, iced)"
license = "GPL-3.0-or-later"

[[bin]]
name = "luma-config"
path = "src/main.rs"

[dependencies]
luma-ipc = { path = "../../libs/luma-ipc" }
libluma = { path = "../../libs/libluma" }
# Migração M1: iced puro no lugar do libcosmic. Sem luma-theme aqui
# tampouco — o app pega cor/theme via libluma (tokens), então o grafo
# fica zero-cosmic e zero-smithay.
# `linux-theme-detection` (default) removido: puxa o `mundy`, que faz um
# call de portal D-Bus (zbus) no boot; com o compositor forçando
# zbus/tokio no workspace, esse call panica sob iced (sem runtime tokio).
# Theme próprio (Golden Hour), detecção de sistema dispensável. Mesma
# lista do libluma (unificação de features).
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland", "svg",
] }
# Camada D-Bus (cliente; ipc.rs intacto, religado à GUI em 2c). Backend
# async-io (default do zbus) — sem cosmic não há runtime tokio, e iced já
# usa zbus via portal com async-io; forçar tokio aqui panica no boot.
zbus = "5"
# Parsing de --tab/--target no boot.
clap = { version = "4", features = ["derive"] }
