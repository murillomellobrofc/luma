[package]
name = "luma-config"
version = "0.1.0"
edition = "2024"
description = "App nativo de configuração do Luma (cliente Wayland, iced)"
license = "GPL-3.0-or-later"

[[bin]]
name = "luma-config"
path = "src/main.rs"

[dependencies]
luma-ipc = { path = "../../libs/luma-ipc" }
libluma = { path = "../../libs/libluma" }
# Migração M1: iced puro no lugar do libcosmic. Sem luma-theme aqui
# tampouco — o app pega cor/theme via libluma (tokens), então o grafo
# fica zero-cosmic e zero-smithay.
# `linux-theme-detection` (default) removido: puxa o `mundy` (call de portal
# zbus no boot), e usamos theme próprio (Golden Hour) — dispensável.
# Executor: **tokio** (não mais thread-pool). O compositor já habilita
# `zbus/tokio` e a unificação de features do Cargo joga isso no zbus daqui
# também; rodando o iced sob thread-pool, o zbus procurava um reactor tokio
# inexistente e paniqueava ("no reactor running, must be called from a Tokio
# runtime") no canal de sinal. Consolidando o iced no executor tokio, o zbus
# tem reactor em todo lugar, igual o compositor. (O acoplamento com cosmic
# que pedia async-io já saiu.) Mesma lista do libluma (unificação).
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "web-colors", "tokio", "x11", "wayland", "svg",
] }
# Cliente D-Bus (ipc.rs). `tokio` explícito pra casar com o executor do iced
# e com o compositor — runtime único no workspace, sem o split frágil.
zbus = { version = "5", features = ["tokio"] }
# Parsing de --tab/--target no boot.
clap = { version = "4", features = ["derive"] }
