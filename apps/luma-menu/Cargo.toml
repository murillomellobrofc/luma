[package]
name = "luma-menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Menu/launcher do Luma — cliente layer-shell overlay (iced)"
license.workspace = true

[[bin]]
name = "luma-menu"
path = "src/main.rs"

[dependencies]
libluma = { path = "../../libs/libluma" }
# Cliente layer-shell. Daemon (multi-surface) pra abrir/fechar a overlay sob
# demanda. Suporta iced 0.14.
iced_layershell = "0.18"
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "web-colors", "tokio", "svg", "image",
] }
# Canal D-Bus (gatilho menu_toggle + acento/HC). `tokio` pro executor.
zbus = { version = "5", features = ["tokio"] }
# Saudação por hora do dia.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
