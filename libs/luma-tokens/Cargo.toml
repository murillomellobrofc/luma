[package]
name = "luma-tokens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tokens compositor-free do Luma — tipo de cor, paleta Golden Hour e camada semântica, lidos do luma.toml. Sem dependência de compositor (smithay)."
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
