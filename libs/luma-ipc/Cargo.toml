[package]
name = "luma-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Contratos D-Bus compartilhados entre compositor e app (DTOs + tipos de domínio)"
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# zvariant direto em vez de zbus pra não arrastar todo o runtime
# (tokio/async-io) dentro de um crate que é só DTO. zbus reexporta
# o mesmo Type — derive funciona idêntico nas pontas.
zvariant = "5"
