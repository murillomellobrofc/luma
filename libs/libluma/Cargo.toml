[package]
name = "libluma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Design system Golden Hour dos apps Luma — theme cosmic + helpers de cor + componentes compartilhados"
license.workspace = true

[dependencies]
# Fonte compositor-free dos tokens (paleta Golden Hour + camada
# semântica), lida do luma.toml. libluma consome SÓ isto — sem
# luma-theme, logo sem smithay/GL no grafo de build do app.
luma-tokens = { path = "../luma-tokens" }
# Migração M1: iced puro no lugar do libcosmic, pra controle total do
# visual. libluma constrói Elements iced (tile, title bar, cor/theme).
# `linux-theme-detection` (default) é REMOVIDO: ele puxa o `mundy`, que lê
# o color-scheme do sistema via portal D-Bus no boot; usamos o theme Golden
# Hour próprio, então detecção é dispensável.
# Executor **tokio** (não thread-pool) pra casar com o luma-config: o
# compositor habilita `zbus/tokio` e a unificação de features espalha isso;
# o runtime tem que ser tokio em todo lugar pro zbus não paniquear. Precisa
# casar com o luma-config (unificação de features).
# `advanced`: expõe `iced::advanced::*` (Widget/Operation/Tree) pro widget
# focável custom (Teclado passo 2) — tiles entram na cadeia de foco do iced.
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "web-colors", "tokio", "x11", "wayland", "svg",
    "advanced",
] }
