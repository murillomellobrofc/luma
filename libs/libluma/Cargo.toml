[package]
name = "libluma"
version = "0.1.0"
edition = "2024"
description = "Design system Golden Hour dos apps Luma — theme cosmic + helpers de cor + componentes compartilhados"
license = "GPL-3.0-or-later"

[dependencies]
# Fonte compositor-free dos tokens (paleta Golden Hour + camada
# semântica), lida do luma.toml. libluma consome SÓ isto — sem
# luma-theme, logo sem smithay/GL no grafo de build do app.
luma-tokens = { path = "../luma-tokens" }
# libcosmic com default-features = false pra evitar arrastar winit,
# tokio, wayland nesta biblioteca de theme — runtime de app é
# responsabilidade do consumidor. Compilador guia se faltar feature.
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false }
