[package]
name = "libluma"
version = "0.1.0"
edition = "2024"
description = "Design system Golden Hour dos apps Luma — theme cosmic + helpers de cor + componentes compartilhados"
license = "GPL-3.0-or-later"

[dependencies]
# Fonte compositor-free dos tokens (paleta Golden Hour + camada
# semântica), lida do luma.toml. libluma consome SÓ isto — sem
# luma-theme, logo sem smithay/GL no grafo de build do app.
luma-tokens = { path = "../luma-tokens" }
# Migração M1: iced puro no lugar do libcosmic, pra controle total do
# visual. libluma constrói Elements iced (tile, title bar, cor/theme).
# `linux-theme-detection` (default) é REMOVIDO: ele puxa o `mundy`, que
# lê o color-scheme do sistema via portal D-Bus (zbus) no boot — e como
# o compositor força zbus/tokio no workspace, esse call panica sob iced.
# Usamos o theme Golden Hour próprio, então detecção de tema é dispensável.
# Precisa casar com o luma-config (unificação de features).
iced = { version = "0.14", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland",
] }
