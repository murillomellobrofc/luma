[package]
name = "luma-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Tema Golden Hour do Luma — Color tokens, defaults, carregamento de luma.toml"
license.workspace = true

[dependencies]
# Fonte única dos valores da paleta Golden Hour (compositor-free). O
# luma-theme adiciona a casca Color32F/smithay por cima destes tokens.
luma-tokens = { path = "../luma-tokens" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = "0.1"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
default-features = false
features = ["renderer_gl"]
