<svg viewBox="0 0 1280 1320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taskbarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1611"/>
      <stop offset="100%" stop-color="#0F0A07"/>
    </linearGradient>
    <filter id="popupShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="1320" fill="#FBF6EE"/>

  <text x="60" y="58" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#1F1611">Luma — System Tray Expansível (H47)</text>
  <text x="60" y="86" font-family="system-ui, sans-serif" font-size="13" fill="#8B7D72">Setinha que esconde ícones extras + suporte a ícones de apps de terceiros (SNI)</text>
  <line x1="60" y1="108" x2="1220" y2="108" stroke="#E8DDD0"/>

  <!-- ===== 1. FECHADO ===== -->
  <text x="60" y="146" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">1 — FECHADO (estado normal)</text>

  <g transform="translate(60, 170)">
    <rect width="1160" height="120" fill="#2A2520" rx="12"/>

    <g transform="translate(620, 28)">
      <rect width="500" height="64" fill="url(#taskbarGrad)" rx="8"/>
      <!-- setinha -->
      <g transform="translate(20, 20)">
        <rect x="-6" y="-6" width="36" height="36" rx="9" fill="#3D2520"/>
        <path d="M 4 9 L 12 17 L 20 9" fill="none" stroke="#FBF6EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- ícones fixos -->
      <g transform="translate(70, 22)" stroke="#FBF6EE" stroke-width="1.5" fill="none" opacity="0.85">
        <rect x="0" y="2" width="20" height="11" rx="1.5"/>
        <g transform="translate(44, 0)" stroke-linecap="round">
          <path d="M 2 9 a 8 6 0 0 1 12 0"/><path d="M 5 12 a 5 4 0 0 1 6 0"/>
        </g>
        <g transform="translate(88, -1)"><path d="M 7 0 L 7 16 L 11 12 L 3 4 M 7 0 L 11 4 L 3 12"/></g>
        <g transform="translate(132, 0)"><path d="M 2 5 L 7 5 L 12 1 L 12 15 L 7 11 L 2 11 Z"/></g>
        <g transform="translate(176, -1)"><path d="M 9 0 a 7 7 0 1 0 0.1 0 M 9 4 L 9 9 L 12 11"/></g>
      </g>
      <text x="250" y="36" font-family="system-ui, sans-serif" font-size="11" fill="#8B7D72">setinha · 5 ícones sempre visíveis (bateria, rede, bt, volume, notif)</text>
    </g>
    <text x="60" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">A setinha ⌄ fica</text>
    <text x="60" y="92" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">à esquerda do tray.</text>
  </g>

  <!-- ===== 2. ABERTO ===== -->
  <text x="60" y="336" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">2 — ABERTO (clica na setinha → painel com os ícones escondidos)</text>

  <g transform="translate(60, 360)">
    <rect width="1160" height="320" fill="#2A2520" rx="12"/>

    <!-- painel de overflow -->
    <g transform="translate(640, 40)" filter="url(#popupShadow)">
      <rect width="220" height="150" fill="#1F1611" rx="14"/>
      <rect width="220" height="2" fill="#E89B3D" opacity="0.5"/>
      <text x="20" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#A89D92" font-weight="600">ÍCONES OCULTOS</text>
      <!-- grid de ícones de terceiros -->
      <g transform="translate(20, 48)">
        <rect width="40" height="40" rx="9" fill="#2A1F1A"/>
        <circle cx="20" cy="20" r="11" fill="#5865F2"/>
        <rect x="52" width="40" height="40" rx="9" fill="#2A1F1A"/>
        <circle cx="72" cy="20" r="11" fill="#1DB954"/>
        <rect x="104" width="40" height="40" rx="9" fill="#2A1F1A"/>
        <circle cx="124" cy="20" r="11" fill="#EE0000"/>
        <rect x="156" width="40" height="40" rx="9" fill="#2A1F1A"/>
        <circle cx="176" cy="20" r="11" fill="#E89B3D"/>
        <rect y="52" width="40" height="40" rx="9" fill="#2A1F1A"/>
        <circle cx="20" cy="72" r="11" fill="#A89D92"/>
      </g>
      <text x="20" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#8B7D72">apps de terceiros via SNI</text>
    </g>

    <!-- taskbar com setinha aberta -->
    <g transform="translate(640, 210)">
      <rect width="500" height="64" fill="url(#taskbarGrad)" rx="8"/>
      <g transform="translate(20, 20)">
        <rect x="-6" y="-6" width="36" height="36" rx="9" fill="#E89B3D"/>
        <path d="M 4 17 L 12 9 L 20 17" fill="none" stroke="#1F1611" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(70, 22)" stroke="#FBF6EE" stroke-width="1.5" fill="none" opacity="0.85">
        <rect x="0" y="2" width="20" height="11" rx="1.5"/>
        <g transform="translate(44, 0)" stroke-linecap="round"><path d="M 2 9 a 8 6 0 0 1 12 0"/></g>
        <g transform="translate(88, -1)"><path d="M 7 0 L 7 16 L 11 12 L 3 4"/></g>
        <g transform="translate(132, 0)"><path d="M 2 5 L 7 5 L 12 1 L 12 15 L 7 11 L 2 11 Z"/></g>
        <g transform="translate(176, -1)"><path d="M 9 0 a 7 7 0 1 0 0.1 0"/></g>
      </g>
    </g>
    <path d="M 660 210 l 0 -20 l 14 0 z" fill="#1F1611"/>

    <text x="60" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">Seta vira pra cima.</text>
    <text x="60" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">Painel mostra os</text>
    <text x="60" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">ícones de apps de</text>
    <text x="60" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">terceiros (Discord,</text>
    <text x="60" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE">Steam, etc).</text>
  </g>

  <!-- ===== 3. SNI ===== -->
  <text x="60" y="726" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">3 — COMO FUNCIONA O SNI</text>

  <g transform="translate(60, 750)">
    <rect width="1160" height="220" fill="#FFFFFF" rx="8" stroke="#E8DDD0"/>

    <text x="30" y="42" font-family="system-ui, sans-serif" font-size="13" fill="#1F1611" font-weight="700">SNI = StatusNotifierItem, o protocolo padrão de tray no Linux moderno</text>

    <text x="30" y="78" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Apps como Discord, Steam, Telegram registram um ícone de tray via D-Bus.</text>
    <text x="30" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">O Luma precisa ser um "StatusNotifierHost": escuta esses registros e</text>
    <text x="30" y="122" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">mostra os ícones. Cada ícone tem: imagem, tooltip, e um menu de clique.</text>

    <text x="30" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#1F1611" font-weight="700">Comportamento:</text>
    <text x="30" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Click esquerdo no ícone = ativa o app · Click direito = menu do app</text>
    <text x="30" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Os 5 ícones nativos (bateria/rede/bt/volume/notif) ficam sempre fora da setinha</text>
  </g>

  <!-- ===== 4. TOKENS ===== -->
  <text x="60" y="1016" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">4 — TOKENS (theme.toml)</text>

  <g transform="translate(60, 1040)">
    <rect width="1160" height="200" fill="#1F1611" rx="12"/>

    <text x="30" y="36" font-family="monospace" font-size="11" fill="#A89D92">[taskbar.tray.overflow]</text>
    <text x="30" y="58" font-family="monospace" font-size="11" fill="#FBF6EE">arrow_size       = <tspan fill="#E89B3D">36</tspan>      <tspan fill="#A89D92"># botão da setinha</tspan></text>
    <text x="30" y="76" font-family="monospace" font-size="11" fill="#FBF6EE">arrow_bg         = <tspan fill="#6B8E7F">"#3D2520"</tspan></text>
    <text x="30" y="94" font-family="monospace" font-size="11" fill="#FBF6EE">arrow_bg_open    = <tspan fill="#6B8E7F">"#E89B3D"</tspan>  <tspan fill="#A89D92"># âmbar quando aberto</tspan></text>
    <text x="30" y="112" font-family="monospace" font-size="11" fill="#FBF6EE">arrow_color      = <tspan fill="#6B8E7F">"#FBF6EE"</tspan></text>
    <text x="30" y="130" font-family="monospace" font-size="11" fill="#FBF6EE">panel_bg         = <tspan fill="#6B8E7F">"#1F1611"</tspan></text>
    <text x="30" y="148" font-family="monospace" font-size="11" fill="#FBF6EE">panel_corner     = <tspan fill="#E89B3D">14</tspan></text>
    <text x="30" y="166" font-family="monospace" font-size="11" fill="#FBF6EE">panel_top_accent = <tspan fill="#6B8E7F">"#E89B3D"</tspan></text>

    <text x="600" y="36" font-family="monospace" font-size="11" fill="#A89D92">[taskbar.tray.sni]</text>
    <text x="600" y="58" font-family="monospace" font-size="11" fill="#FBF6EE">icon_size      = <tspan fill="#E89B3D">22</tspan></text>
    <text x="600" y="76" font-family="monospace" font-size="11" fill="#FBF6EE">icon_button    = <tspan fill="#E89B3D">40</tspan>     <tspan fill="#A89D92"># área clicável</tspan></text>
    <text x="600" y="94" font-family="monospace" font-size="11" fill="#FBF6EE">icon_button_bg = <tspan fill="#6B8E7F">"#2A1F1A"</tspan></text>
    <text x="600" y="112" font-family="monospace" font-size="11" fill="#FBF6EE">icon_gap       = <tspan fill="#E89B3D">12</tspan></text>
    <text x="600" y="130" font-family="monospace" font-size="11" fill="#FBF6EE">grid_columns   = <tspan fill="#E89B3D">4</tspan></text>
    <text x="600" y="148" font-family="monospace" font-size="11" fill="#FBF6EE">hover_bg       = <tspan fill="#6B8E7F">"#3D2520"</tspan></text>
    <text x="600" y="178" font-family="monospace" font-size="10" fill="#8B7D72"># painel some ao clicar fora ou apertar Esc</text>
  </g>
</svg>
