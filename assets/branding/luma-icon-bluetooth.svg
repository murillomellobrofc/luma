<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#FBF6EE"/>

  <text x="40" y="48" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#1F1611">Luma — Ícone de Bluetooth</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#8B7D72">2 estados · runa clássica do Bluetooth · system tray 20px · Golden Hour</text>
  <line x1="40" y1="90" x2="760" y2="90" stroke="#E8DDD0"/>

  <!-- PREVIEW GRANDE -->
  <g transform="translate(40, 120)">
    <rect width="720" height="170" fill="#1F1611" rx="12"/>

    <!-- ON -->
    <g transform="translate(150, 45)">
      <g transform="scale(3.4)">
        <path d="M 8 7 L 16 17 L 12 21 L 12 3 L 16 7 L 8 17"
              fill="none" stroke="#FBF6EE" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="40" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#A89D92" text-anchor="middle">Ligado</text>
      <text x="40" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#6B8E7F" text-anchor="middle">cream cheio</text>
    </g>

    <!-- OFF -->
    <g transform="translate(440, 45)">
      <g transform="scale(3.4)">
        <path d="M 8 7 L 16 17 L 12 21 L 12 3 L 16 7 L 8 17"
              fill="none" stroke="#8B7D72" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="3" y1="3" x2="21" y2="21"
              stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="40" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#A89D92" text-anchor="middle">Desligado</text>
      <text x="40" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#D97757" text-anchor="middle">cinza + risco coral</text>
    </g>
  </g>

  <!-- TAMANHO REAL -->
  <g transform="translate(40, 322)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1" fill="#8B7D72">TAMANHO REAL — 20px</text>
    <g transform="translate(0, 14)">
      <rect width="180" height="52" fill="#1F1611" rx="10"/>
      <g transform="translate(48, 16)">
        <path d="M 8 7 L 16 17 L 12 21 L 12 3 L 16 7 L 8 17"
              fill="none" stroke="#FBF6EE" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(112, 16)">
        <path d="M 8 7 L 16 17 L 12 21 L 12 3 L 16 7 L 8 17"
              fill="none" stroke="#8B7D72" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="3" y1="3" x2="21" y2="21"
              stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <g transform="translate(360, 322)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1" fill="#8B7D72">REGRA DE ESTADO</text>
    <text x="0" y="22" font-family="monospace" font-size="11" fill="#4A3933">bluetooth ligado    →  on  (runa cream)</text>
    <text x="0" y="40" font-family="monospace" font-size="11" fill="#4A3933">bluetooth desligado →  off (cinza + risco coral)</text>
    <text x="0" y="64" font-family="system-ui, sans-serif" font-size="10" fill="#8B7D72" font-style="italic">Mesmo padrão do volume: coral sempre marca o estado "off/problema".</text>
  </g>
</svg>
