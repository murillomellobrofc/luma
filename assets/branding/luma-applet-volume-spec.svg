<svg viewBox="0 0 1280 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taskbarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1611"/>
      <stop offset="100%" stop-color="#0F0A07"/>
    </linearGradient>
    <filter id="popupShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1280" height="1180" fill="#FBF6EE"/>

  <text x="60" y="58" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#1F1611">Luma — Popup de Volume</text>
  <text x="60" y="86" font-family="system-ui, sans-serif" font-size="13" fill="#8B7D72">Clica no ícone de volume na bandeja → abre um painelzinho com slider</text>
  <line x1="60" y1="108" x2="1220" y2="108" stroke="#E8DDD0"/>

  <!-- ===== 1. EM CONTEXTO ===== -->
  <text x="60" y="146" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">1 — POPUP ABERTO (acima do ícone de volume)</text>

  <g transform="translate(60, 170)">
    <rect width="1160" height="400" fill="#3A4A5C" rx="12"/>

    <!-- popup -->
    <g transform="translate(840, 70)" filter="url(#popupShadow)">
      <rect width="280" height="190" fill="#1F1611" rx="14"/>
      <rect width="280" height="2" fill="#E89B3D" opacity="0.5" rx="14 14 0 0"/>

      <!-- título -->
      <text x="24" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#FBF6EE" font-weight="600">Volume</text>
      <text x="256" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#E89B3D" text-anchor="end" font-weight="600">68%</text>

      <!-- ícone + slider -->
      <g transform="translate(24, 64)">
        <!-- ícone volume -->
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <!-- trilho do slider -->
        <rect x="34" y="9" width="190" height="6" rx="3" fill="#3D2520"/>
        <!-- preenchido -->
        <rect x="34" y="9" width="129" height="6" rx="3" fill="#E89B3D"/>
        <!-- bolinha -->
        <circle cx="163" cy="12" r="9" fill="#F5D5A8"/>
      </g>

      <!-- botão mudo -->
      <g transform="translate(24, 116)">
        <rect width="232" height="44" fill="#2A1F1A" rx="10"/>
        <g transform="translate(16, 12)">
          <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#A89D92"/>
          <line x1="16" y1="7" x2="22" y2="14" stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="7" x2="16" y2="14" stroke="#D97757" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="50" y="28" font-family="system-ui, sans-serif" font-size="13" fill="#FBF6EE">Silenciar</text>
      </g>
    </g>

    <!-- seta apontando pro ícone -->
    <path d="M 968 260 l -10 16 l 20 0 z" fill="#1F1611"/>

    <!-- taskbar -->
    <g transform="translate(0, 336)">
      <rect width="1160" height="64" fill="url(#taskbarGrad)"/>
      <rect width="1160" height="2" fill="#E89B3D" opacity="0.5"/>
      <!-- ícones tray -->
      <g transform="translate(880, 22)" stroke="#FBF6EE" stroke-width="1.5" fill="none" opacity="0.85">
        <rect x="0" y="2" width="20" height="11" rx="1.5"/>
        <g transform="translate(40, 0)" stroke-linecap="round">
          <path d="M 2 9 a 8 6 0 0 1 12 0"/>
          <path d="M 5 12 a 5 4 0 0 1 6 0"/>
        </g>
      </g>
      <!-- ícone volume destacado (clicado) -->
      <g transform="translate(968, 14)">
        <rect x="-12" y="0" width="40" height="40" fill="#3D2520" rx="9"/>
        <g transform="translate(0, 10)">
          <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
          <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== 2. ANATOMIA ===== -->
  <text x="60" y="616" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">2 — ANATOMIA</text>

  <g transform="translate(60, 640)">
    <rect width="1160" height="240" fill="#FFFFFF" rx="8" stroke="#E8DDD0"/>

    <text x="30" y="40" font-family="system-ui, sans-serif" font-size="13" fill="#1F1611" font-weight="700">Painelzinho ~280×190, ancorado acima do ícone de volume</text>

    <text x="30" y="76" font-family="monospace" font-size="12" fill="#E89B3D" font-weight="700">TÍTULO</text>
    <text x="170" y="76" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">"Volume" à esquerda + porcentagem grande à direita (cor âmbar)</text>

    <text x="30" y="110" font-family="monospace" font-size="12" fill="#D97757" font-weight="700">SLIDER</text>
    <text x="170" y="110" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Ícone de volume + trilho. Parte preenchida âmbar, bolinha honey.</text>
    <text x="170" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#8B7D72">Arrastar a bolinha muda o volume. Click no trilho pula pro ponto.</text>

    <text x="30" y="162" font-family="monospace" font-size="12" fill="#6B8E7F" font-weight="700">BOTÃO MUDO</text>
    <text x="170" y="162" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Botão largo "Silenciar". Click alterna mudo/com som.</text>

    <text x="30" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#1F1611" font-weight="700">Comportamento:</text>
    <text x="30" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#4A3933">Click no ícone abre · click fora ou Esc fecha · scroll no ícone também muda volume direto · seta âmbar aponta pro ícone de origem</text>
  </g>

  <!-- ===== 3. TOKENS ===== -->
  <text x="60" y="926" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">3 — TOKENS (theme.toml)</text>

  <g transform="translate(60, 950)">
    <rect width="1160" height="190" fill="#1F1611" rx="12"/>

    <text x="30" y="36" font-family="monospace" font-size="11" fill="#A89D92">[applet.popup]   # base comum a todos os popups</text>
    <text x="30" y="56" font-family="monospace" font-size="11" fill="#FBF6EE">bg              = <tspan fill="#6B8E7F">"#1F1611"</tspan></text>
    <text x="30" y="74" font-family="monospace" font-size="11" fill="#FBF6EE">corner_radius   = <tspan fill="#E89B3D">14</tspan></text>
    <text x="30" y="92" font-family="monospace" font-size="11" fill="#FBF6EE">top_accent      = <tspan fill="#6B8E7F">"#E89B3D"</tspan></text>
    <text x="30" y="110" font-family="monospace" font-size="11" fill="#FBF6EE">shadow_blur     = <tspan fill="#E89B3D">14</tspan></text>
    <text x="30" y="128" font-family="monospace" font-size="11" fill="#FBF6EE">arrow_size      = <tspan fill="#E89B3D">10</tspan>   <tspan fill="#A89D92"># seta apontando</tspan></text>
    <text x="30" y="146" font-family="monospace" font-size="11" fill="#FBF6EE">margin_from_bar = <tspan fill="#E89B3D">8</tspan></text>

    <text x="420" y="36" font-family="monospace" font-size="11" fill="#A89D92">[applet.volume]</text>
    <text x="420" y="56" font-family="monospace" font-size="11" fill="#FBF6EE">width            = <tspan fill="#E89B3D">280</tspan></text>
    <text x="420" y="74" font-family="monospace" font-size="11" fill="#FBF6EE">height           = <tspan fill="#E89B3D">190</tspan></text>
    <text x="420" y="92" font-family="monospace" font-size="11" fill="#FBF6EE">title_color      = <tspan fill="#6B8E7F">"#FBF6EE"</tspan></text>
    <text x="420" y="110" font-family="monospace" font-size="11" fill="#FBF6EE">pct_color        = <tspan fill="#6B8E7F">"#E89B3D"</tspan></text>
    <text x="420" y="128" font-family="monospace" font-size="11" fill="#FBF6EE">mute_button_bg   = <tspan fill="#6B8E7F">"#2A1F1A"</tspan></text>

    <text x="800" y="36" font-family="monospace" font-size="11" fill="#A89D92">[applet.volume.slider]</text>
    <text x="800" y="56" font-family="monospace" font-size="11" fill="#FBF6EE">track_bg     = <tspan fill="#6B8E7F">"#3D2520"</tspan></text>
    <text x="800" y="74" font-family="monospace" font-size="11" fill="#FBF6EE">track_fill   = <tspan fill="#6B8E7F">"#E89B3D"</tspan></text>
    <text x="800" y="92" font-family="monospace" font-size="11" fill="#FBF6EE">track_height = <tspan fill="#E89B3D">6</tspan></text>
    <text x="800" y="110" font-family="monospace" font-size="11" fill="#FBF6EE">knob_color   = <tspan fill="#6B8E7F">"#F5D5A8"</tspan></text>
    <text x="800" y="128" font-family="monospace" font-size="11" fill="#FBF6EE">knob_radius  = <tspan fill="#E89B3D">9</tspan></text>
  </g>
</svg>
