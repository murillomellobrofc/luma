<svg viewBox="0 0 1280 1700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D5A8"/>
      <stop offset="100%" stop-color="#E89B3D"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF6EE"/>
    </linearGradient>
    <filter id="cursorShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="1700" fill="#FBF6EE"/>

  <text x="60" y="60" font-family="Georgia, serif" font-size="36" font-weight="600" fill="#1F1611">Luma Cursor Family</text>
  <text x="60" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#8B7D72">Modern soft-edge cursor com ponta âmbar · 11 variantes essenciais · 4 tamanhos</text>
  <line x1="60" y1="120" x2="1220" y2="120" stroke="#E8DDD0"/>

  <!-- 1. DEFAULT ARROW -->
  <text x="60" y="160" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">1 — DEFAULT ARROW (cursor principal, "L de Luma")</text>

  <g transform="translate(60, 200)">
    <rect width="280" height="280" fill="#1F1611" rx="12"/>
    <!-- Large arrow drawn directly at scale 5x (paths in 0-160 space) -->
    <g transform="translate(70, 30)" filter="url(#cursorShadow)">
      <path d="M 20 15 L 20 130 L 55 100 L 70 135 L 90 125 L 75 90 L 115 90 Z"
            fill="url(#creamGrad)"
            stroke="#1F1611"
            stroke-width="6"
            stroke-linejoin="round"
            stroke-linecap="round"/>
      <circle cx="20" cy="15" r="6" fill="#E89B3D"/>
    </g>
    <text x="140" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92" text-anchor="middle">VISTA AMPLIADA 5×</text>
  </g>

  <g transform="translate(380, 200)">
    <rect width="780" height="280" fill="#FFFFFF" rx="12" stroke="#E8DDD0"/>
    <text x="30" y="35" font-family="system-ui, sans-serif" font-size="13" fill="#1F1611" font-weight="700">Construção</text>
    <text x="30" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Forma: arrow softened (não pontuda agressiva)</text>
    <text x="30" y="80" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Fill: gradiente Cream sutil (FFFFFF → FBF6EE)</text>
    <text x="30" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Outline: Coffee #1F1611 stroke 1.5px, linejoin round</text>
    <text x="30" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Ponta: bolinha âmbar #E89B3D (a "luz" assinatura)</text>
    <text x="30" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Drop shadow: blur 1.5px offset y=1 preto @ 0.35</text>

    <text x="30" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#1F1611" font-weight="700">Por que esse design</text>
    <text x="30" y="205" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Cream + outline = visível em fundo claro E escuro</text>
    <text x="30" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Bolinha âmbar na ponta = ponto de luz da marca</text>
    <text x="30" y="245" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Forma "L" abstrata reforça identidade Luma</text>
    <text x="30" y="265" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">• Soft (não agressivo) combina com Golden Hour</text>
  </g>

  <!-- 2. TAMANHOS -->
  <text x="60" y="520" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">2 — TAMANHOS REAIS</text>

  <g transform="translate(60, 560)">
    <rect width="1160" height="160" fill="#1F1611" rx="12"/>

    <!-- 24px -->
    <g transform="translate(100, 50)" filter="url(#cursorShadow)">
      <path d="M 3 2 L 3 19 L 8 15 L 10 20 L 13 19 L 11 14 L 17 14 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="3" cy="2" r="0.9" fill="#E89B3D"/>
    </g>
    <text x="110" y="110" font-family="monospace" font-size="11" fill="#A89D92" text-anchor="middle">24 px</text>
    <text x="110" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#8B7D72" text-anchor="middle">HiDPI</text>

    <!-- 32px -->
    <g transform="translate(250, 45)" filter="url(#cursorShadow)">
      <path d="M 4 3 L 4 26 L 11 20 L 14 27 L 18 25 L 15 18 L 23 18 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="4" cy="3" r="1.2" fill="#E89B3D"/>
    </g>
    <text x="262" y="110" font-family="monospace" font-size="11" fill="#A89D92" text-anchor="middle">32 px</text>
    <text x="262" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#8B7D72" text-anchor="middle">base</text>

    <!-- 48px -->
    <g transform="translate(420, 38)" filter="url(#cursorShadow)">
      <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
    </g>
    <text x="440" y="110" font-family="monospace" font-size="11" fill="#A89D92" text-anchor="middle">48 px</text>
    <text x="440" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#8B7D72" text-anchor="middle">2K</text>

    <!-- 64px -->
    <g transform="translate(610, 30)" filter="url(#cursorShadow)">
      <path d="M 8 6 L 8 52 L 22 40 L 28 54 L 36 51 L 30 36 L 46 36 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="8" cy="6" r="2.4" fill="#E89B3D"/>
    </g>
    <text x="636" y="110" font-family="monospace" font-size="11" fill="#A89D92" text-anchor="middle">64 px</text>
    <text x="636" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#8B7D72" text-anchor="middle">4K</text>

    <!-- 96px -->
    <g transform="translate(830, 18)" filter="url(#cursorShadow)">
      <path d="M 12 9 L 12 78 L 33 60 L 42 81 L 54 76 L 45 54 L 69 54 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="12" cy="9" r="3.6" fill="#E89B3D"/>
    </g>
    <text x="869" y="110" font-family="monospace" font-size="11" fill="#A89D92" text-anchor="middle">96 px</text>
    <text x="869" y="124" font-family="system-ui, sans-serif" font-size="9" fill="#8B7D72" text-anchor="middle">acessibilidade</text>
  </g>

  <!-- 3. VARIANTES -->
  <text x="60" y="760" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">3 — 11 VARIANTES (renderizadas em 48px)</text>

  <g transform="translate(60, 800)">
    <rect width="1160" height="440" fill="#1F1611" rx="12"/>

    <!-- ROW 1: 5 cursors -->

    <!-- default -->
    <g transform="translate(60, 40)">
      <g filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">default</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">arrow</text>
    </g>

    <!-- pointer (hand) -->
    <g transform="translate(220, 40)">
      <g filter="url(#cursorShadow)">
        <!-- Hand with extended finger -->
        <path d="M 14 6 L 14 22 M 14 6 a 3 3 0 0 1 6 0 v 12 a 2.5 2.5 0 0 1 5 0 v 4 a 2.5 2.5 0 0 1 5 0 v 4 a 2.5 2.5 0 0 1 5 0 v 6 a 7 7 0 0 1 -7 7 h -6 a 7 7 0 0 1 -7 -7 v -12 a 2.5 2.5 0 0 1 5 0"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="14" cy="6" r="1.5" fill="#E89B3D"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">pointer</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">link</text>
    </g>

    <!-- text (I-beam) -->
    <g transform="translate(380, 40)">
      <g filter="url(#cursorShadow)">
        <path d="M 12 6 L 22 6 M 17 6 L 17 38 M 12 38 L 22 38"
              stroke="#1F1611" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 12 6 L 22 6 M 17 6 L 17 38 M 12 38 L 22 38"
              stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">text</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">I-beam</text>
    </g>

    <!-- grab -->
    <g transform="translate(540, 40)">
      <g filter="url(#cursorShadow)">
        <path d="M 8 22 v -4 a 3 3 0 0 1 6 0 v -4 a 3 3 0 0 1 6 0 v -2 a 3 3 0 0 1 6 0 v 4 a 3 3 0 0 1 6 0 v 12 a 9 9 0 0 1 -9 9 h -6 a 9 9 0 0 1 -9 -9 v -8"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">grab</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">mão aberta</text>
    </g>

    <!-- grabbing -->
    <g transform="translate(700, 40)">
      <g filter="url(#cursorShadow)">
        <path d="M 8 18 v 12 a 9 9 0 0 0 9 9 h 6 a 9 9 0 0 0 9 -9 v -12 a 3 3 0 0 0 -6 0 v 6"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 26 18 a 3 3 0 0 0 -6 0 v 6 M 20 18 a 3 3 0 0 0 -6 0 v 6 M 14 18 a 3 3 0 0 0 -6 0 v 6"
              stroke="#1F1611" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">grabbing</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">mão fechada</text>
    </g>

    <!-- wait (full spinner) -->
    <g transform="translate(860, 40)">
      <g filter="url(#cursorShadow)">
        <circle cx="20" cy="20" r="16" fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2"/>
        <circle cx="20" cy="20" r="16" fill="none" stroke="url(#amberGrad)" stroke-width="3" stroke-dasharray="50 50" stroke-linecap="round" transform="rotate(-45 20 20)"/>
        <circle cx="20" cy="20" r="3" fill="#E89B3D"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">wait</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">spinner</text>
    </g>

    <!-- ROW 2 -->

    <!-- progress -->
    <g transform="translate(60, 220)">
      <g filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
        <!-- Mini spinner -->
        <g transform="translate(30, 30)">
          <circle cx="0" cy="0" r="7" fill="url(#creamGrad)" stroke="#1F1611" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="7" fill="none" stroke="#E89B3D" stroke-width="2" stroke-dasharray="20 15" stroke-linecap="round" transform="rotate(45)"/>
        </g>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">progress</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">arrow + load</text>
    </g>

    <!-- not-allowed -->
    <g transform="translate(220, 220)">
      <g filter="url(#cursorShadow)">
        <circle cx="20" cy="20" r="16" fill="url(#creamGrad)" stroke="#D97757" stroke-width="3"/>
        <line x1="9" y1="31" x2="31" y2="9" stroke="#D97757" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">not-allowed</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">bloqueado</text>
    </g>

    <!-- crosshair -->
    <g transform="translate(380, 220)">
      <g filter="url(#cursorShadow)">
        <line x1="20" y1="4" x2="20" y2="14" stroke="#1F1611" stroke-width="4" stroke-linecap="round"/>
        <line x1="20" y1="26" x2="20" y2="36" stroke="#1F1611" stroke-width="4" stroke-linecap="round"/>
        <line x1="4" y1="20" x2="14" y2="20" stroke="#1F1611" stroke-width="4" stroke-linecap="round"/>
        <line x1="26" y1="20" x2="36" y2="20" stroke="#1F1611" stroke-width="4" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="20" y2="14" stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="26" x2="20" y2="36" stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round"/>
        <line x1="4" y1="20" x2="14" y2="20" stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round"/>
        <line x1="26" y1="20" x2="36" y2="20" stroke="url(#creamGrad)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="2" fill="#E89B3D"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">crosshair</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">precisão</text>
    </g>

    <!-- help -->
    <g transform="translate(540, 220)">
      <g filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
        <g transform="translate(30, 28)">
          <circle cx="0" cy="0" r="8" fill="#E89B3D" stroke="#1F1611" stroke-width="2"/>
          <text x="0" y="4" font-family="system-ui, sans-serif" font-size="12" fill="#1F1611" text-anchor="middle" font-weight="700">?</text>
        </g>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">help</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">tooltip</text>
    </g>

    <!-- resize-ns -->
    <g transform="translate(700, 220)">
      <g filter="url(#cursorShadow)">
        <path d="M 20 4 L 12 14 L 17 14 L 17 26 L 12 26 L 20 36 L 28 26 L 23 26 L 23 14 L 28 14 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">resize-ns</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">vertical</text>
    </g>

    <!-- resize-ew -->
    <g transform="translate(860, 220)">
      <g filter="url(#cursorShadow)">
        <path d="M 4 20 L 14 12 L 14 17 L 26 17 L 26 12 L 36 20 L 26 28 L 26 23 L 14 23 L 14 28 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <text x="20" y="70" font-family="system-ui, sans-serif" font-size="12" fill="#FBF6EE" text-anchor="middle" font-weight="700">resize-ew</text>
      <text x="20" y="86" font-family="monospace" font-size="9" fill="#8B7D72" text-anchor="middle">horizontal</text>
    </g>

    <!-- Note -->
    <g transform="translate(60, 360)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92">+ 6 variantes de resize diagonal (NE/NW/SE/SW) na mesma família visual</text>
      <text x="0" y="18" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92">Total: 17 cursors no theme final (11 essenciais + 6 resize)</text>
    </g>
  </g>

  <!-- 4. TESTE EM WALLPAPERS -->
  <text x="60" y="1290" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">4 — TESTE DE CONTRASTE</text>

  <g transform="translate(60, 1320)">
    <!-- Fundo escuro -->
    <rect x="0" y="0" width="560" height="180" fill="#1F1611" rx="8"/>
    <text x="20" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92" letter-spacing="1">FUNDO ESCURO (Coffee)</text>
    <g transform="translate(140, 80)" filter="url(#cursorShadow)">
      <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
    </g>
    <g transform="translate(260, 80)" filter="url(#cursorShadow)">
      <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
    </g>
    <g transform="translate(380, 80)" filter="url(#cursorShadow)">
      <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
            fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
    </g>

    <!-- Fundo claro -->
    <g transform="translate(600, 0)">
      <rect width="560" height="180" fill="#E8DDD0" rx="8"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#8B7D72" letter-spacing="1">FUNDO CLARO (Cream escurecido)</text>
      <g transform="translate(140, 80)" filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
      </g>
      <g transform="translate(260, 80)" filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
      </g>
      <g transform="translate(380, 80)" filter="url(#cursorShadow)">
        <path d="M 6 4 L 6 39 L 16 30 L 21 41 L 27 38 L 22 27 L 35 27 Z"
              fill="url(#creamGrad)" stroke="#1F1611" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="6" cy="4" r="1.8" fill="#E89B3D"/>
      </g>
    </g>
  </g>

  <!-- 5. ESTRUTURA -->
  <text x="60" y="1560" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">5 — ARQUIVOS NO REPO</text>

  <g transform="translate(60, 1580)">
    <rect width="1160" height="90" fill="#1F1611" rx="8"/>
    <text x="30" y="30" font-family="monospace" font-size="11" fill="#A89D92">assets/cursors/luma/</text>
    <text x="30" y="50" font-family="monospace" font-size="11" fill="#F5D5A8">├── svg/   (fonte: 11 SVGs essenciais + 8 resize)</text>
    <text x="30" y="70" font-family="monospace" font-size="11" fill="#F5D5A8">└── theme/ (formato Xcursor binário gerado via xcursorgen)</text>
  </g>
</svg>
