<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#FBF6EE"/>

  <text x="40" y="48" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#1F1611">Luma — Ícones de Volume</text>
  <text x="40" y="72" font-family="system-ui, sans-serif" font-size="12" fill="#8B7D72">4 estados · estilo preenchido sólido · system tray 20px · Golden Hour</text>
  <line x1="40" y1="90" x2="760" y2="90" stroke="#E8DDD0"/>

  <!-- ======= PREVIEW GRANDE (fundo escuro, como na taskbar) ======= -->
  <g transform="translate(40, 120)">
    <rect width="720" height="160" fill="#1F1611" rx="12"/>

    <!-- HIGH -->
    <g transform="translate(70, 50)">
      <g transform="scale(2.6)">
        <!-- corpo do alto-falante -->
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <!-- 3 ondas -->
        <path d="M 16 5 a 7 7 0 0 1 0 12" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="26" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#A89D92" text-anchor="middle">Alto</text>
    </g>

    <!-- MEDIUM -->
    <g transform="translate(245, 50)">
      <g transform="scale(2.6)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="22" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#A89D92" text-anchor="middle">Médio</text>
    </g>

    <!-- LOW -->
    <g transform="translate(420, 50)">
      <g transform="scale(2.6)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="18" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#A89D92" text-anchor="middle">Baixo</text>
    </g>

    <!-- MUTED -->
    <g transform="translate(595, 50)">
      <g transform="scale(2.6)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#8B7D72"/>
        <!-- X coral -->
        <line x1="16.5" y1="7.5" x2="23" y2="14.5" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="23" y1="7.5" x2="16.5" y2="14.5" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <text x="26" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#A89D92" text-anchor="middle">Mudo</text>
    </g>
  </g>

  <!-- ======= TAMANHO REAL (20px, como vai aparecer) ======= -->
  <g transform="translate(40, 312)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1" fill="#8B7D72">TAMANHO REAL — 20px no system tray</text>

    <g transform="translate(0, 16)">
      <rect width="320" height="56" fill="#1F1611" rx="10"/>
      <!-- high -->
      <g transform="translate(30, 18)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 5 a 7 7 0 0 1 0 12" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <!-- medium -->
      <g transform="translate(105, 18)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 8.5 a 4 4 0 0 1 0 5" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <!-- low -->
      <g transform="translate(180, 18)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 16 11 a 1.4 1.4 0 0 1 0 0" fill="none" stroke="#FBF6EE" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <!-- muted -->
      <g transform="translate(255, 18)">
        <path d="M 2 7 L 7 7 L 13 2 L 13 20 L 7 15 L 2 15 Z" fill="#8B7D72"/>
        <line x1="16.5" y1="7.5" x2="23" y2="14.5" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
        <line x1="23" y1="7.5" x2="16.5" y2="14.5" stroke="#D97757" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- ======= NOTAS ======= -->
  <g transform="translate(400, 312)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1" fill="#8B7D72">REGRA DE ESTADO</text>
    <text x="0" y="22" font-family="monospace" font-size="11" fill="#4A3933">volume &gt; 66%   →  alto (3 ondas)</text>
    <text x="0" y="40" font-family="monospace" font-size="11" fill="#4A3933">volume 33-66%  →  médio (2 ondas)</text>
    <text x="0" y="58" font-family="monospace" font-size="11" fill="#4A3933">volume 1-33%   →  baixo (1 onda)</text>
    <text x="0" y="76" font-family="monospace" font-size="11" fill="#4A3933">mudo ou 0%     →  mudo (corpo cinza + X coral)</text>
  </g>
</svg>
