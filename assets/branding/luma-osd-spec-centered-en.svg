<svg viewBox="0 0 1280 1120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="taskbarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1611"/>
      <stop offset="100%" stop-color="#0F0A07"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A4A5C"/>
      <stop offset="100%" stop-color="#5C6B7A"/>
    </linearGradient>
    <filter id="osdShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="1120" fill="#FBF6EE"/>

  <text x="60" y="58" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#1F1611">Luma — OSD (centered)</text>
  <text x="60" y="86" font-family="system-ui, sans-serif" font-size="13" fill="#8B7D72">Volume and brightness OSD, centered in the middle of the screen.</text>
  <line x1="60" y1="108" x2="1220" y2="108" stroke="#E8DDD0"/>

  <text x="60" y="146" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">1 — SCREEN POSITION (centered, both axes)</text>

  <g transform="translate(60, 170)">
    <rect width="1160" height="440" fill="url(#wallGrad)" rx="12"/>

    <!-- center crosshair guides -->
    <line x1="580" y1="40" x2="580" y2="400" stroke="#FBF6EE" stroke-width="1" stroke-dasharray="4 6" opacity="0.35"/>
    <line x1="80" y1="220" x2="1080" y2="220" stroke="#FBF6EE" stroke-width="1" stroke-dasharray="4 6" opacity="0.35"/>

    <!-- OSD centered: pill 260x64, center at (580,220) -> x=450,y=188 -->
    <g transform="translate(450, 188)" filter="url(#osdShadow)">
      <rect width="260" height="64" fill="#1F1611" rx="16"/>
      <g transform="translate(24, 22)">
        <path d="M 2 7 L 8 7 L 15 1 L 15 21 L 8 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 19 8 a 5 5 0 0 1 0 6" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 22 5 a 9 9 0 0 1 0 12" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="66" y="29" width="138" height="6" rx="3" fill="#3D2520"/>
      <rect x="66" y="29" width="94" height="6" rx="3" fill="#E89B3D"/>
      <text x="236" y="37" font-family="system-ui, sans-serif" font-size="14" fill="#F5D5A8" text-anchor="end" font-weight="600">68%</text>
    </g>

    <!-- taskbar at bottom (OSD is NOT near it) -->
    <g transform="translate(0, 376)">
      <rect width="1160" height="64" fill="url(#taskbarGrad)"/>
      <rect width="1160" height="2" fill="#E89B3D" opacity="0.5"/>
      <circle cx="34" cy="32" r="14" fill="#3D2520"/>
    </g>

    <text x="580" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#FBF6EE" text-anchor="middle" opacity="0.85">center of the pill = center of the screen</text>
  </g>

  <text x="60" y="656" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">2 — VOLUME AND BRIGHTNESS (same pill, centered)</text>

  <g transform="translate(60, 680)">
    <rect width="1160" height="180" fill="#2A2520" rx="12"/>

    <!-- volume -->
    <g transform="translate(170, 58)">
      <rect width="260" height="64" fill="#1F1611" rx="16"/>
      <g transform="translate(24, 22)">
        <path d="M 2 7 L 8 7 L 15 1 L 15 21 L 8 15 L 2 15 Z" fill="#FBF6EE"/>
        <path d="M 19 8 a 5 5 0 0 1 0 6" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
        <path d="M 22 5 a 9 9 0 0 1 0 12" fill="none" stroke="#FBF6EE" stroke-width="2" stroke-linecap="round"/>
      </g>
      <rect x="66" y="29" width="138" height="6" rx="3" fill="#3D2520"/>
      <rect x="66" y="29" width="94" height="6" rx="3" fill="#E89B3D"/>
      <text x="236" y="37" font-family="system-ui, sans-serif" font-size="14" fill="#F5D5A8" text-anchor="end" font-weight="600">68%</text>
    </g>
    <text x="300" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92" text-anchor="middle">volume — speaker icon</text>

    <!-- brightness -->
    <g transform="translate(630, 58)">
      <rect width="260" height="64" fill="#1F1611" rx="16"/>
      <g transform="translate(40, 32)">
        <circle cx="0" cy="0" r="7" fill="none" stroke="#FBF6EE" stroke-width="2"/>
        <g stroke="#FBF6EE" stroke-width="2" stroke-linecap="round">
          <line x1="0" y1="-12" x2="0" y2="-15"/>
          <line x1="0" y1="12" x2="0" y2="15"/>
          <line x1="-12" y1="0" x2="-15" y2="0"/>
          <line x1="12" y1="0" x2="15" y2="0"/>
          <line x1="-8.5" y1="-8.5" x2="-10.5" y2="-10.5"/>
          <line x1="8.5" y1="8.5" x2="10.5" y2="10.5"/>
          <line x1="-8.5" y1="8.5" x2="-10.5" y2="10.5"/>
          <line x1="8.5" y1="-8.5" x2="10.5" y2="-10.5"/>
        </g>
      </g>
      <rect x="66" y="29" width="138" height="6" rx="3" fill="#3D2520"/>
      <rect x="66" y="29" width="108" height="6" rx="3" fill="#E89B3D"/>
      <text x="236" y="37" font-family="system-ui, sans-serif" font-size="14" fill="#F5D5A8" text-anchor="end" font-weight="600">78%</text>
    </g>
    <text x="760" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#A89D92" text-anchor="middle">brightness — sun icon</text>
  </g>

  <text x="60" y="906" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8B7D72">3 — BEHAVIOR & TOKENS</text>

  <g transform="translate(60, 930)">
    <rect width="560" height="160" fill="#FFFFFF" rx="8" stroke="#E8DDD0"/>
    <text x="28" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Appears on a volume or brightness keypress</text>
    <text x="28" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Centered in the screen, both axes</text>
    <text x="28" y="96" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Stays ~1.5s, each key resets the timer</text>
    <text x="28" y="124" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Smooth fade-out, never steals focus</text>
    <text x="28" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#4A3933">Never blocks clicks underneath</text>
  </g>

  <g transform="translate(660, 930)">
    <rect width="560" height="160" fill="#1F1611" rx="8"/>
    <text x="28" y="36" font-family="monospace" font-size="11" fill="#A89D92">[osd]</text>
    <text x="28" y="58" font-family="monospace" font-size="11" fill="#FBF6EE">width         = <tspan fill="#E89B3D">260</tspan></text>
    <text x="28" y="76" font-family="monospace" font-size="11" fill="#FBF6EE">height        = <tspan fill="#E89B3D">64</tspan></text>
    <text x="28" y="94" font-family="monospace" font-size="11" fill="#FBF6EE">corner_radius = <tspan fill="#E89B3D">16</tspan></text>
    <text x="28" y="112" font-family="monospace" font-size="11" fill="#FBF6EE">position      = <tspan fill="#6B8E7F">"center"</tspan>  <tspan fill="#A89D92"># middle of screen</tspan></text>
    <text x="28" y="130" font-family="monospace" font-size="11" fill="#FBF6EE">timeout_ms    = <tspan fill="#E89B3D">1500</tspan></text>
    <text x="28" y="148" font-family="monospace" font-size="11" fill="#FBF6EE">fade_ms       = <tspan fill="#E89B3D">200</tspan></text>
  </g>
</svg>
