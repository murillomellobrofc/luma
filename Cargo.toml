[workspace]
resolver = "3"
members = [
    "compositor/luma",
    "libs/libluma",
    "libs/luma-tokens",
    "libs/luma-theme",
    "libs/luma-widget",
    "libs/luma-ipc",
    "libs/luma-customize",
    "apps/luma-config",
    "apps/luma-bar",
    "apps/luma-menu",
]

# Versão/edition/licença ÚNICAS do projeto — cada crate herda com
# `version.workspace = true`. Antes cada Cargo.toml tinha a sua linha e a
# versão derivou (compositor em 0.3.0, os outros 9 em 0.1.0); a versão sai
# em runtime no `Ping` do D-Bus e no `GetServerInformation` do servidor de
# notificações, então tem que ser uma só.
# `rust-version` é o piso da edition 2024 — não é uma MSRV testada.
[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

# Fork local do smithay pra patch do winit backend (multi-window). H35.
# Mantém URL no Smithay dep dos crates; patch substitui pelo path local.
# Path relativo à raiz do workspace (vendor/ continua na raiz).
[patch.'https://github.com/Smithay/smithay.git']
smithay = { path = "vendor/smithay" }
